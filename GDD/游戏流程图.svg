<svg viewBox="0 0 680 250" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      --lumi-ink: light-dark(#000000, #e0e0e0);
      --lumi-muted: light-dark(#5f6368, #9aa0a6);
      --lumi-dim: light-dark(#f2f0f0, #242528);
      --lumi-container: light-dark(#e8e6e6, #2d2f33);
      --lumi-outline: light-dark(#727676, #9a9b9c);
      --lumi-accent-bg: light-dark(#dcf1ff, #192967);
      --lumi-primary: light-dark(#3186ff, #9dd2ff);
      --lumi-sans: 'Google Sans Flex', var(--font-family, 'Google Sans', sans-serif);
      --lumi-mono: 'Google Sans Code', ui-monospace, monospace;
    }
    text { font-weight: 400; stroke: none; }
    .t-l1 { font-family: var(--lumi-sans); font-size: 15px; fill: var(--lumi-ink); }
    .t-l2 { font-family: var(--lumi-mono); font-size: 12px; font-style: italic; fill: var(--lumi-ink); }
    .t-l4 { font-family: var(--lumi-sans); font-size: 12px; fill: var(--lumi-muted); }
    .node-step { fill: var(--lumi-dim); stroke: none; }
    .node-focal { fill: var(--lumi-accent-bg); stroke: var(--lumi-primary); stroke-width: 1.25; }
    .node-store { fill: var(--lumi-container); stroke: var(--lumi-outline); stroke-width: 1; }
    .edge-seg { fill: none; stroke: var(--lumi-ink); stroke-width: 1.3; stroke-linecap: round; stroke-dasharray: 0 4; }
    .edge-arrow { fill: none; stroke: var(--lumi-ink); stroke-width: 1.3; stroke-linecap: round; stroke-dasharray: 0 4; marker-end: url(#lumi-caret-4); }
  </style>
  <defs>
    <marker id="lumi-caret-4" viewBox="0 0 10 10" refX="7.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 3 1.2 L 7.5 5 L 3 8.8" fill="none" stroke="var(--lumi-ink)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
  </defs>

  <!-- Play Again Loop -->
  <path class="edge-seg" d="M 582 58 L 582 38 Q 582 22 566 22 L 512 22" />
  <rect x="424" y="12" width="80" height="20" rx="10" fill="var(--lumi-dim)" />
  <text class="t-l2" x="464" y="22" text-anchor="middle" dominant-baseline="central">Play Again</text>
  <path class="edge-arrow" d="M 416 22 L 356 22 Q 340 22 340 38 L 340 58" />

  <!-- Main Row -->
  <rect class="node-step" x="20" y="66" width="156" height="72" rx="36" />
  <text class="t-l1" x="98" y="94" text-anchor="middle" dominant-baseline="central">Title Screen</text>
  <text class="t-l4" x="98" y="114" text-anchor="middle" dominant-baseline="central">难度选择 · EN/中文</text>

  <line class="edge-arrow" x1="184" y1="102" x2="254" y2="102" />

  <rect class="node-focal" x="262" y="66" width="156" height="72" rx="36" />
  <text class="t-l1" x="340" y="94" text-anchor="middle" dominant-baseline="central">Gameplay</text>
  <text class="t-l4" x="340" y="114" text-anchor="middle" dominant-baseline="central">12×12 核心对局</text>

  <line class="edge-arrow" x1="426" y1="102" x2="496" y2="102" />

  <rect class="node-store" x="504" y="66" width="156" height="72" rx="36" />
  <text class="t-l1" x="582" y="94" text-anchor="middle" dominant-baseline="central">Game Over</text>
  <text class="t-l4" x="582" y="114" text-anchor="middle" dominant-baseline="central">战绩 · 分难度榜单</text>

  <!-- Pause Bidirectional -->
  <line class="edge-arrow" x1="322" y1="146" x2="322" y2="164" />
  <line class="edge-arrow" x1="358" y1="164" x2="358" y2="146" />
  <text class="t-l4" x="296" y="155" text-anchor="end" dominant-baseline="central">Esc / P</text>
  <text class="t-l4" x="384" y="155" text-anchor="start" dominant-baseline="central">Resume</text>

  <rect class="node-store" x="262" y="172" width="156" height="64" rx="32" />
  <text class="t-l1" x="340" y="196" text-anchor="middle" dominant-baseline="central">Pause Overlay</text>
  <text class="t-l4" x="340" y="216" text-anchor="middle" dominant-baseline="central">棋盘模糊 · 设置/重开</text>
</svg>